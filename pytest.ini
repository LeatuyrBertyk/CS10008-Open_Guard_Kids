[pytest]
# Cấu hình pytest cho project OGK Parental Control
# Chạy: pytest                    (toàn bộ test)
# Chạy: pytest -v                 (verbose, hiện tên từng test)
# Chạy: pytest --cov=server --cov=agent  (đo coverage)
# Chạy: pytest -m unit            (chỉ chạy test unit, bỏ integration)

testpaths = server/tests agent/tests

# Pattern nhận diện file test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Đánh dấu các loại test
markers =
    unit: Unit test - chạy nhanh, không cần network
    integration: Integration test - cần server chạy
    slow: Test chạy chậm

# In ra câu lệnh assert chi tiết khi fail
addopts = -ra --strict-markers

# Thiết lập đường dẫn (giúp import module dễ dàng)
pythonpath = .
