name: computer_network
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pip
  - pip:
      # Core web framework
      - fastapi>=0.100.0
      - uvicorn[standard]>=0.22.0
      - websockets>=11.0
      - requests>=2.31.0
      - sqlalchemy>=2.0.0
      - jinja2>=3.1.0
      - python-multipart>=0.0.5

      # Authentication
      - bcrypt>=4.0.0
      - python-jose[cryptography]>=3.3.0

      # System monitoring (Agent)
      - psutil>=5.9.0
      - pywin32>=306; sys_platform == 'win32'

      # DNS proxy
      - dnslib>=0.9.0

      # UI cho Agent
      - pystray>=0.19.0
      - pillow>=10.0.0

      # Testing
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - httpx>=0.24.0
